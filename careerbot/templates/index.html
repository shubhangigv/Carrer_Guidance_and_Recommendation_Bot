<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareerBot – Career Guidance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="chat">
    <header>
      <h1>🎓 CareerBot</h1>
      <p>Your personal career guidance &amp; recommendation assistant</p>
      <button id="restart" type="button">Restart</button>
    </header>
    <section id="messages" aria-live="polite"></section>
    <form id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Type your answer..." aria-label="Message" maxlength="500" required>
      <button type="submit">Send</button>
    </form>
    <div id="chips"></div>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
